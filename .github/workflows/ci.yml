name: CPU correctness
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.6"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest -q
      - run: uv run --locked mini-deepinfer --max-tokens 4
      - run: uv run --locked python examples/validate_device.py --device cpu
      - run: uv build
      - name: Check older PyTorch compatibility without changing the lock
        if: matrix.python == '3.10'
        run: |
          uv pip install "torch==2.5.1" --index-url https://download.pytorch.org/whl/cpu
          uv run --no-sync pytest -q
